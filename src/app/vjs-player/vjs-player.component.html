    <div class="speed-container" *ngIf="isPlaybackrate">
        <div class="close-container" (click)="togglePlaybackrate($event)">
            <img src="assets/img/icons/close.svg" alt="Close">
        </div>
        <div class="speed-content">
            <ng-container *ngFor="let rate of playbackrates; let i = index;">
                <div class="speed-btn" [id]="rate" (click)="setPlaybackrate($event, rate)">
                    <h6>{{ rate.toFixed(2) }}x</h6>
                </div>
            </ng-container>
        </div>
    </div>
</div>
